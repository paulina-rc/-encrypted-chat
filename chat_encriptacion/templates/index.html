<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de encriptación de mensajes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="contenedor">

        <!-- Encabezado -->
        <header>
            <h1>Chat de encriptación <span>de mensajes</span></h1>
            <div class="estado">
                <span class="etiqueta"><span class="punto"></span>Servidor <b>{{ ip_servidor }}</b></span>
                <span class="etiqueta">Tú: <b>{{ mi_ip }}</b></span>
            </div>
        </header>

        <!-- Chat -->
        <section class="chat">
            <div id="mensajes" class="mensajes">
                <p id="vacio" class="vacio">Todavía no hay mensajes</p>
            </div>
            <form id="formulario" class="entrada">
                <input type="text" id="texto" placeholder="Escribe un mensaje..." autocomplete="off">
                <button type="submit">Enviar</button>
            </form>
        </section>

        <!-- Consola -->
        <h2>Consola <small>procesos internos del sistema</small></h2>
        <section class="consola">
            <div class="columna">
                <h3>Al enviar</h3>
                <div id="consola-envio"></div>
            </div>
            <div class="columna">
                <h3>Al recibir</h3>
                <div id="consola-recibo"></div>
            </div>
        </section>

    </div>
    <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
